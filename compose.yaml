services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vecteron
      POSTGRES_PASSWORD: vecteron_local
      POSTGRES_DB: vecteron
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vecteron -d vecteron"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
